services:
  - type: web
    name: data-security
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REFERRAL_CODE
        value: "404"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: "user-files"
      - key: MAX_FILE_SIZE_MB
        value: "100"
